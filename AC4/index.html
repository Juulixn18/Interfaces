<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Perfumería Esencia</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    
    <div class="precarga">
        <img src="img/cargando.gif" alt="Cargando">
        <p>Cargando web...</p>
    </div>

   
    <header>
        <div class="marca">
            <img src="img/logo.svg" alt="Logo grande" class="logo-grande">
            <h1>Perfumería Esencia</h1>
        </div>
        
        <nav>
            <a href="#">Inicio</a>
            <a href="#">Perfumes</a>
            <a href="#">Contacto</a>
            <img src="img/logo.svg" alt="Logo pequeño" class="logo-pequeno">
        </nav>
    </header>

    
    <main>
        <section class="hero">
            <h2>Nuestras mejores fragancias</h2>
            <p>Aromas únicos para cada ocasión</p>
            <img src="img/hero.webp" alt="Perfume principal" class="foto-hero">
        </section>
    </main>

    
    <footer>
        <p>Perfumería Esencia - 2026</p>
        <div class="redes">
            <a href="#"><img src="img/instagram.svg" alt="Instagram"></a>
            <a href="#"><img src="img/facebook.svg" alt="Facebook"></a>
            <a href="#"><img src="img/twitter.svg" alt="Twitter"></a>
        </div>
    </footer>

</body>
</html>
